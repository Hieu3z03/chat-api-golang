name: chat-api

services:
  centrifugo:
    container_name: centrifugo
    image: centrifugo/centrifugo:v6
    volumes:
      - ./deploy/centrifugo/config.json:/centrifugo/config.json
    command: centrifugo -c /centrifugo/config.json
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET_KEY:-change_me_centrifugo_token_secret}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-change_me_centrifugo_api_key}
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD:-change_me_admin}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET:-change_me_centrifugo_admin_secret}
    ports:
      - 8000:8000
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: chat-api:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      GIN_MODE: ${GIN_MODE:-release}
      GOLANG_PORT: "8888"
      DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
      MONGO_URI: ${DOCKER_MONGO_URI:-mongodb://host.docker.internal:27017}
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-change_me_centrifugo_api_key}
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET_KEY:-change_me_centrifugo_token_secret}
    ports:
      - "${GOLANG_PORT:-8888}:8888"
    depends_on:
      centrifugo:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8888"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
